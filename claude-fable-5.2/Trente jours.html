<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>Trente jours</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen arcade cabinet. Thin HUD strip on top, the stage fills the rest, cards float over the stage. */
:root{
  color-scheme:dark;
  --bg:#1b1420;      /* aubergine night */
  --panel:#2a1f31;
  --ink:#f6efe4;     /* diner porcelain */
  --dim:#b7a9bd;
  --hot:#ff5a3c;     /* tomato vinyl */
  --sun:#ffc531;     /* mustard */
  --mint:#58e0c0;    /* silicon */
  --disp:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
[hidden]{display:none!important}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--disp);font-weight:500;
  display:flex;flex-direction:column;gap:8px;box-sizing:border-box;overflow:hidden;
  padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
#hud{display:flex;align-items:center;gap:10px;width:100%;max-width:960px;margin:0 auto;font-family:var(--mono);font-size:13px;min-height:36px}
#lv{color:var(--dim);white-space:nowrap}
#days{cursor:pointer;flex:1;min-width:0;display:flex;align-items:center;gap:8px}
#dn{color:var(--sun);font-weight:500;white-space:nowrap;min-width:4ch;text-align:right;font-variant-numeric:tabular-nums}
#dbar{flex:1;height:8px;border-radius:99px;background:var(--panel);overflow:hidden;min-width:30px}
#dbar i{display:block;height:100%;width:100%;background:var(--sun);border-radius:99px;transition:background .2s}
#sc{font-variant-numeric:tabular-nums;white-space:nowrap}
#hud button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid #47384f;border-radius:99px;min-width:40px;height:34px;padding:0 10px;cursor:pointer}
#hud button:focus-visible,.card button:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
#stage{position:relative;flex:1;min-height:0;width:100%;max-width:960px;margin:0 auto;border-radius:14px;overflow:hidden;background:#0d0a10}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
#pg{position:absolute;left:0;top:0;right:0;height:7px;background:rgba(255,255,255,.08);pointer-events:none}
#pg i{display:block;height:100%;width:0;background:var(--mint)}
#ov{position:absolute;inset:0;display:grid;place-items:center;padding:20px;background:rgba(22,14,26,.8);overflow:auto}
.card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px}
.card h1{font-size:clamp(3rem,15vw,5rem);line-height:.86;margin:0;font-weight:800;letter-spacing:-.03em;text-wrap:balance}
.card h1 em{font-style:normal;color:var(--sun)}
.card h2{font-size:clamp(2rem,9vw,3rem);line-height:.95;margin:0;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.card p{margin:0;line-height:1.4}
.yr{font-family:var(--mono);color:var(--sun);letter-spacing:.08em;text-transform:uppercase;font-size:13px}
.fact{color:var(--dim);font-size:15px}
.how{font-size:18px}
.note{font-family:var(--mono);font-size:11.5px;color:var(--dim);border-left:2px solid var(--hot);padding-left:10px}
.row{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.card button{font-family:var(--disp);font-weight:800;font-size:18px;border-radius:99px;border:0;padding:13px 26px;cursor:pointer}
.go{background:var(--sun);color:#1b1420}
.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px #5b4a63}
.card button.dot{font-family:var(--mono);font-weight:500;font-size:14px;width:36px;height:36px;padding:0;background:var(--panel);color:var(--ink)}
.card button.dot:disabled{opacity:.3;cursor:default}
.card button.seg{font-family:var(--mono);font-weight:500;font-size:13px;padding:9px 14px;background:var(--panel);color:var(--ink)}
.card button.seg.on{background:var(--mint);color:#1b1420}
#ov.party{background:rgba(22,14,26,.3);place-items:start center}
#ov.party .card{background:rgba(22,14,26,.82);padding:16px 18px;border-radius:14px}
.stars{font-size:28px;color:var(--sun);letter-spacing:.08em}
.card button.dot{height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.dot small{font-size:8px;color:var(--sun);height:9px;letter-spacing:1px}
.best{font-family:var(--mono);font-size:13px;color:var(--mint)}
</style>

<div id="hud">
  <span id="lv"></span>
  <div id="days"><span id="dn">30</span><div id="dbar"><i></i></div></div>

  <button id="bm" type="button" aria-label="Menu">≡</button>

<div id="stage">

  <div id="ov"><div class="card" id="card"></div></div>
</div>

function guy(x,y,s,run,dir,hk,fit){const f=FIT[fit]||{},u=s*1.2/24,h=hairRGB(clamp(hk==null?.6:hk,0,1)),sw=Math.sin(run),lg=Math.round(sw*3),am=Math.round(-sw*2);

    const k=w.length&&Math.random()<.72?w[Math.random()*w.length|0]:(era()&&Math.random()<.3?'chip':foods[Math.random()*3|0]);items.push({k,x:W+50,y:beltY()})}

        if(!served&&G.state==='play'&&(held?held.k===b.want:false)){ctx.strokeStyle='rgba(27,20,32,.6)';ctx.lineWidth=3;ctx.setLineDash([5,7]);ctx.beginPath();ctx.arc(x,bb,br*(1.3+Math.sin(TT*6)*.1),0,7);ctx.stroke();ctx.setLineDash([])}}

    for(const sgn of[-1,1]){ctx.save();ctx.translate(W/2+sgn*H*.16,H*.9-H*.2-j*.5);ctx.rotate(Math.sin(T*8)*.3*sgn);ctx.beginPath();ctx.ellipse(0,0,H*.05,H*.014,0,0,7);ctx.fillStyle='#fffaf0';ctx.fill();ctx.strokeStyle='#58e0c0';ctx.lineWidth=3;ctx.stroke();ctx.restore()}}}}

const LEVELS=[LP,L1,L2,L3,L4,LX,L5,L6,L7,L8,L9,LB];

/* ---------- loop ---------- */
let last=performance.now(),hudKey='';
function hud(){const s=S[lang],k=[G.state,G.lvl,Math.ceil(G.days),G.score,lang,G.god].join('|');
  $('pg').firstElementChild.style.width=(G.state==='title'||!G.cur?0:clamp(G.cur.prog(),0,1)*100)+'%';
  if(k===hudKey)return;hudKey=k;
  $('lv').textContent=G.state==='title'?'':`${G.lvl+1}/12 · ${yr(G.lvl)}`;
  $('dn').textContent=G.god?'∞':Math.ceil(G.days)+s.d;const b=$('dbar').firstElementChild;b.style.width=clamp(G.days/30*100,0,100)+'%';b.style.background=G.days<=8?'var(--hot)':'var(--sun)';
  $('sc').textContent=G.score}
function frame(now){const dt=Math.min(.033,Math.max(0,(now-last)/1000));last=now;TT+=dt;
  try{
    if(G.state==='play'&&G.cd>0){const b=Math.ceil(G.cd/.5);G.cd-=dt;if(Math.ceil(G.cd/.5)!==b)beep(G.cd>0?440:880,.1,'triangle',.06)}
    else if(G.cur&&(G.state==='play'||G.state==='outro'||G.state==='end'||G.state==='end2'))G.cur.update(dt);
    ctx.setTransform(DPR,0,0,DPR,0,0);ctx.save();
    if(G.shake>0){G.shake-=dt;if(!calm)ctx.translate(rnd(-1,1)*G.shake*22,rnd(-1,1)*G.shake*22)}
    if(G.cur)G.cur.draw();
    for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.g)p.vy+=p.g*dt;const a=clamp(p.life/p.max,0,1);ctx.globalAlpha=a;
      if(p.t)txt(p.t,p.x,p.y,Math.max(18,H*.035),p.col);else{ctx.fillStyle=p.col;ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s)}}
    ctx.globalAlpha=1;parts=parts.filter(p=>p.life>0);if(G.state==='play'&&mult()>1)txt('×'+mult(),W-14,H*.12,Math.max(22,H*.045),'#58e0c0','right');ctx.restore();
    if(G.state==='play'&&G.cd>0){ctx.fillStyle='rgba(22,14,26,.45)';ctx.fillRect(0,0,W,H);const k=G.cd/.5,f=k-Math.floor(k);txt(Math.ceil(k),W/2,H/2,Math.min(W,H)*.3*(.7+f*.5),`rgba(255,197,49,${.4+f*.6})`)}
    if(G.state==='play'&&!G.god&&G.days<=8){const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);g.addColorStop(0,'rgba(255,60,40,0)');g.addColorStop(1,`rgba(255,60,40,${.25+.2*Math.sin(TT*(14-G.days))})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
    if(G.flash>0){G.flash-=dt;ctx.fillStyle=`rgba(255,60,40,${Math.max(0,G.flash)*.7})`;ctx.fillRect(0,0,W,H)}
    hud();music();
  }catch(e){console.error(e)}
  requestAnimationFrame(frame)}

if(location.hash==='#dbg')window.__g={G,intro,LEVELS,win,finish,save};
setMute();title();setLang();requestAnimationFrame(frame);
})();
</script>
